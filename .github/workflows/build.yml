name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, portable)
        run: dotnet publish src/StealthBrowser.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Bundle VC++ runtime (app-local, no install needed)
        shell: pwsh
        run: |
          $dlls = @("msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","vcruntime140.dll","vcruntime140_1.dll","concrt140.dll")
          foreach ($d in $dlls) {
            $src = "C:\Windows\System32\$d"
            if (Test-Path $src) { Copy-Item $src publish/ -Force; Write-Host "bundled $d" }
            else { Write-Host "missing $d" }
          }

      - name: Package
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx=5 StealthBrowser-win-x64.zip ./publish/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealthBrowser-win-x64
          path: StealthBrowser-win-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: StealthBrowser-win-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StealthBrowser-win-x64.zip
          generate_release_notes: true
