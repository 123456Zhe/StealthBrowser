name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: dotnet build StealthBrowser.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin/Release/StealthBrowser.exe dist/
          Copy-Item bin/Release/WebView2Loader.dll dist/
          Copy-Item bin/Release/Microsoft.Web.WebView2.*.dll dist/
          Compress-Archive -Path dist/* -DestinationPath StealthBrowser-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealthBrowser-win-x64
          path: StealthBrowser-win-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: StealthBrowser-win-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StealthBrowser-win-x64.zip
          generate_release_notes: true
